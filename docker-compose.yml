services:
  db:
    image: postgres:18
    container_name: postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: shop_db
      POSTGRES_USER: shapoor
      POSTGRES_PASSWORD: botcampapi
    ports:
      - "127.0.0.1:5432:5432"
    

volumes:
  postgres_data: